name: Release

# Push a tag like v0.1.0 (it must match the "Version:" line in wpflatsign.php) and this attaches an installable zip to a GitHub release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: wpflatsign

      - name: Check the tag matches the plugin version
        run: |
          V=$(grep -m1 '^ \* Version:' wpflatsign/wpflatsign.php | awk '{print $3}')
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Version: $V in wpflatsign.php" >&2
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Build the zip (the plugin folder, without development files)
        run: |
          zip -rq "wpflatsign-$VERSION.zip" wpflatsign \
            -x "wpflatsign/.git/*" "wpflatsign/.github/*" "wpflatsign/.gitignore" "wpflatsign/ui/*" "wpflatsign/vite*.js" "wpflatsign/package*.json" "wpflatsign/API.md" \
               "wpflatsign/node_modules/*" "wpflatsign/lib/dompdf/tests/*" '*.DS_Store'
          cp "wpflatsign-$VERSION.zip" wpflatsign.zip   # a stable name, so .../releases/latest/download/wpflatsign.zip always works
          unzip -l wpflatsign.zip | tail -1

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wpflatsign-${{ env.VERSION }}.zip
            wpflatsign.zip
          generate_release_notes: true
